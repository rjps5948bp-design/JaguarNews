backend:
  name: github
  repo: rjps5948bp-design/JaguarNews # <-- edit this
  branch: main

# Sveltia CMS reads/writes plain JSON when the file collection format is "json"
media_folder: "assets/uploads"
public_folder: "/JaguarNews/assets/uploads"

collections:
  - name: "home"
    label: "Home Page"
    files:
      - name: "home"
        label: "Home"
        file: "data/index.json"
        fields:
          - {label: "Tag (e.g. Breaking)", name: "hero_tag", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Byline", name: "byline", widget: "string"}
          - {label: "Lede paragraph", name: "lede", widget: "text"}
          - label: "Latest Stories (3 cards)"
            name: "stories"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "Article ID (must match the ID of a real article on the Articles page)", name: "id", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Excerpt", name: "excerpt", widget: "text"}
              - {label: "Photo", name: "photo", widget: "image", required: false}

  - name: "about"
    label: "About Us Page"
    files:
      - name: "about"
        label: "About"
        file: "data/about.json"
        fields:
          - {label: "Intro paragraph", name: "lede", widget: "text"}
          - {label: "Our mission", name: "mission", widget: "text"}
          - {label: "How we report", name: "how_we_report", widget: "text"}
          - {label: "Get involved", name: "get_involved", widget: "text"}
          - label: "Newsroom Leadership (Editor-in-Chief, Assistant Editor, Teacher)"
            name: "leadership"
            widget: "list"
            summary: "{{name}} — {{role}}"
            fields:
              - {label: "Role (e.g. Editor-in-Chief)", name: "role", widget: "string"}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "Description", name: "description", widget: "text"}
          - label: "Our Departments (6 sections)"
            name: "departments"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "Department name", name: "title", widget: "string"}
              - {label: "Department description", name: "description", widget: "text"}
              - {label: "Leader's photo", name: "leader_photo", widget: "image", required: false}
              - {label: "Leader's title (e.g. Head of Writing)", name: "leader_title", widget: "string"}
              - {label: "Leader's name", name: "leader_name", widget: "string"}
              - {label: "Leader's short description", name: "leader_bio", widget: "text"}

  - name: "newsletter"
    label: "Newsletter Page"
    files:
      - name: "newsletter"
        label: "Newsletter"
        file: "data/newsletter.json"
        fields:
          - {label: "Intro paragraph", name: "lede", widget: "text"}
          - label: "Past Issues"
            name: "issues"
            widget: "list"
            fields:
              - {label: "Issue number", name: "number", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Date", name: "date", widget: "string"}

  - name: "podcast"
    label: "Podcast Page"
    files:
      - name: "podcast"
        label: "Podcast"
        file: "data/podcast.json"
        fields:
          - {label: "Show description", name: "lede", widget: "text"}
          - label: "Episodes"
            name: "episodes"
            widget: "list"
            fields:
              - {label: "Episode number", name: "number", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Length (e.g. 24 min)", name: "length", widget: "string"}

  - name: "articles"
    label: "Articles Page"
    files:
      - name: "articles"
        label: "Articles"
        file: "data/articles.json"
        fields:
          - {label: "Intro paragraph", name: "lede", widget: "text"}
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "ID (letters, numbers, dashes only — no spaces, must be unique)", name: "id", widget: "string"}
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["News", "Opinion", "Features", "Culture"]
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Excerpt (shown on the articles grid)", name: "excerpt", widget: "text"}
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "Full article text (start a new paragraph on a new line)", name: "body", widget: "text"}

  - name: "videos"
    label: "Videos Page"
    files:
      - name: "videos"
        label: "Videos"
        file: "data/videos.json"
        fields:
          - {label: "Intro paragraph", name: "lede", widget: "text"}
          - {label: "Featured video (paste a YouTube link)", name: "featured_video_url", widget: "string", required: false}
          - {label: "Featured video title", name: "featured_video_title", widget: "string", required: false}
          - {label: "Featured video description", name: "featured_video_description", widget: "text", required: false}
          - label: "Videos"
            name: "videos"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Length (e.g. 3:42)", name: "length", widget: "string"}
              - {label: "YouTube link (paste the video URL)", name: "youtube_url", widget: "string", required: false}

  - name: "gallery"
    label: "Photo Gallery Page"
    files:
      - name: "gallery"
        label: "Gallery"
        file: "data/gallery.json"
        fields:
          - {label: "Intro paragraph", name: "lede", widget: "text"}
          - label: "Topics (albums)"
            name: "topics"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "ID (letters, numbers, dashes only — no spaces, must be unique, e.g. graduacion-2026)", name: "id", widget: "string"}
              - {label: "Topic title", name: "title", widget: "string"}
              - {label: "Cover photo (shown on the main gallery page)", name: "cover", widget: "image", required: false}
              - {label: "Description (shown when hovering over the cover)", name: "description", widget: "text"}
              - label: "Photos in this topic"
                name: "photos"
                widget: "list"
                fields:
                  - {label: "Photo", name: "image", widget: "image", required: false}
                  - {label: "Caption", name: "caption", widget: "string"}
